# BetterInstaller engine strings: English, the reference catalogue.
#
# Every other catalogue in this folder is checked against this one (i18n tests): a key
# present here and missing elsewhere falls back to English at runtime, and the test says so.
#
# Adding a language = adding `<code>.toml` next to this file (e.g. `de.toml`, `pt-BR.toml`).
# No code change: build.rs embeds every file in this folder. A product can also ship a
# catalogue inside its signed package (see `[i18n]` in GUIDE.md), with no engine rebuild.
#
# Placeholders in braces are filled in by the engine: {app} {publisher} {version}
# {installed_version} {new_version} are always available; others are listed per key.

[meta]
name = "English"        # shown in the language picker, in the language itself
direction = "ltr"       # "ltr" or "rtl"

[ui]
next = "Next"
back = "Back"
