name: Docs

# Builds the bilingual documentation site and publishes it to GitHub Pages on master.
# A pull request gets the same build without publishing, so a broken internal link or a
# dead anchor is caught before it reaches readers rather than after.
#
# Separate from ci.yml on purpose: that one is the Rust workspace (fmt, clippy, tests) and
# has nothing to do with the docs. Coupling them would mean a typo in a markdown file
# blocking a code merge, and a Rust failure hiding a broken site.

on:
  push:
    branches: [master]
    # Only when something that can change the site changes. A Rust-only commit does not
    # need to rebuild and republish the docs.
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --strict turns a broken internal link into a failed build. Without it mkdocs prints
      # a warning nobody reads and publishes the dead link anyway.
      #
      # It is NOT sufficient on its own: mkdocs reports an unresolved ANCHOR as INFO, which
      # --strict tolerates. That is how a French page shipped links to `#pré-import-…` while
      # the generated ids had their accents stripped. The slugify setting in mkdocs.yml is
      # the fix; the grep below is what stops it regressing, since the build would stay
      # green either way.
      - name: Build (strict)
        run: mkdocs build --strict

      - name: Anchors survive their accents
        run: |
          set -e
          f=site/fr/HANDOFF/index.html
          test -f "$f" || { echo "::error::$f was not generated — the FR build is broken"; exit 1; }
          grep -q 'id="pré-import-contenu-bundlé"' "$f" || {
            echo "::error::accented heading ids are being transliterated again — check the toc slugify in mkdocs.yml"
            exit 1
          }
          echo "accented anchors OK"

      # Both locales must actually exist. i18n's fallback_to_default means a missing French
      # page silently serves English, so "the build passed" says nothing about the FR site
      # being there at all.
      - name: Both locales built
        run: |
          set -e
          en=$(find site -maxdepth 2 -name index.html -not -path 'site/fr/*' | wc -l)
          fr=$(find site/fr -maxdepth 2 -name index.html | wc -l)
          echo "EN pages: $en · FR pages: $fr"
          test "$en" -ge 10 || { echo "::error::only $en English pages built"; exit 1; }
          test "$fr" -ge 10 || { echo "::error::only $fr French pages built"; exit 1; }

      # WeasyPrint dlopens these at runtime; the list has to match the PINNED version in
      # requirements.txt (v53 dropped cairo, v57 added harfbuzz-subset). Pinning one without
      # the other is how the PDF build breaks on a runner image update and nowhere else.
      - name: PDF system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu

      - name: Build the PDF edition
        run: mkdocs build -f mkdocs.pdf.yml

      # mkdocs-with-pdf reports success as long as it wrote a file — it did exactly that
      # while emitting a tenth of the book. Open the result and count.
      - name: The PDF is not truncated
        run: python tools/check_pdf.py site/pdf/betterinstaller.pdf --min-pages 25 --expect "BetterInstaller" --expect ".bpkg"

      - uses: actions/upload-artifact@v4
        with:
          name: betterinstaller-pdf
          path: site/pdf/betterinstaller.pdf

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
