# Reviewed Trivy exclusions. Read by the `trivy fs` step of .github/workflows/security.yml
# (--ignorefile .github/security/trivyignore.yaml), which also passes --show-suppressed: every
# entry below stays listed in each run's report and in the gate summary as "ignored", with
# its statement, so an exclusion never silently shrinks the report.
#
# Rules for an entry: a false positive or an accepted risk only, never "to go green"; scoped to
# the narrowest path; a statement saying why; an expiry (expired_at), after which the finding
# fails the gate again and the entry has to be reviewed, not just re-dated.

misconfigurations:
  # "No HEALTHCHECK defined" (LOW). The dev image is a one-shot container: it runs the
  # fmt / clippy / test / build gate and exits, or an interactive shell. There is no
  # long-running service to probe, so a HEALTHCHECK would test nothing. Scoped to this one
  # Dockerfile: an image that runs a service must still define one.
  - id: DS-0026
    paths:
      - "Dockerfile"
    statement: "One-shot dev/CI container (runs the gate and exits); no long-running service to health-check."
    expired_at: 2027-03-25
