# BetterInstaller — dev / CI in a container.
#
#   docker compose run --rm ci          # the full gate (fmt + clippy + test + build)
#   docker compose run --rm ci bash -c "cargo clippy --workspace --all-targets -- -D warnings"
#   docker compose run --rm shell       # interactive shell with the toolchain + deps
#
# Named volumes cache the Cargo registry + the Linux target dir, so repeat runs are fast
# and Linux build artifacts never touch your host ./target.
#
# The image runs as the unprivileged user `dev` (see the Dockerfile), and each volume below is
# mounted over a directory the image creates owned by dev. Volumes made by an older, root-run
# image stay root-owned: on "Permission denied" under /usr/local/cargo or /tmp/target, run
# `docker compose down --volumes` once. On a Linux host whose uid is not 1000, build with your
# ids so files written into the bind mount are yours:
#   BI_UID="$(id -u)" BI_GID="$(id -g)" docker compose build

services:
  ci:
    build:
      context: .
      args:
        UID: ${BI_UID:-1000}
        GID: ${BI_GID:-1000}
    image: betterinstaller-dev
    working_dir: /app
    environment:
      CARGO_TARGET_DIR: /tmp/target
    volumes:
      - .:/app
      - bi-target:/tmp/target
      - bi-cargo-registry:/usr/local/cargo/registry
      - bi-cargo-git:/usr/local/cargo/git
    # default command = the image's CMD (fmt + clippy + test + build)

  shell:
    extends: ci
    entrypoint: ["bash"]
    # Not `-l`: a login shell re-runs /etc/profile, which replaces PATH and drops
    # /usr/local/cargo/bin with it — see the note in the Dockerfile.
    command: []
    stdin_open: true
    tty: true

volumes:
  bi-target:
  bi-cargo-registry:
  bi-cargo-git:
