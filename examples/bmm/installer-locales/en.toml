# Better Mods Manager installer: English strings installer.toml has no field for.
#
# Labels and descriptions are written in English in installer.toml itself; this file only
# holds what a TOML option cannot say, the readable label of each `select` choice. Without
# it the dropdowns would show raw values ("full", "network").
#
# Copied into the signed package by build-installer.ps1 (installer-locales/).

[options.language.choices]
auto = "Same as the installer"
en = "English"
fr = "Français"

[options.system_access.choices]
full = "Full access"
limited = "Limited"

[options.csp_preset.choices]
none = "Default"
network = "Pin the network"
strict = "Strict"
custom = "Custom"

[options.ai_features]
label = "Optional AI features (Laya)"
description = "Off by default. Lets BMM suggest a mod's details (from its own files, and tags ranked among yours by the Laya classifier) and check a bug report before it is sent. Ticking it only turns the feature on: nothing is sent until you choose a provider in Settings → AI (BetterCommunity, your own Laya server, or an external API), and then only when you click Suggest. BMM includes no AI model. Settings → AI turns it off at any time."
