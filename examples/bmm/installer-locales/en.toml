# Better Mods Manager installer: English strings installer.toml has no field for.
#
# Labels and descriptions are written in English in installer.toml itself; this file only
# holds what a TOML option cannot say, the readable label of each `select` choice. Without
# it the dropdowns would show raw values ("full", "network").
#
# Copied into the signed package by build-installer.ps1 (installer-locales/).

[options.language.choices]
auto = "Same as the installer"
en = "English"
fr = "Français"

[options.system_access.choices]
full = "Full access"
limited = "Limited"

[options.csp_preset.choices]
none = "Default"
network = "Pin the network"
strict = "Strict"
custom = "Custom"

[options.ai_features]
label = "Laya offline (local AI, nothing sent)"
description = "On by default: it is local — nothing leaves this PC. Installs the Laya classifier inside BMM (a 327 MB download during setup, 404 MB on disk, verified against its pinned SHA-256) so that, when you click Suggest, BMM can rank tags among yours, recognise a text's language and check a bug report before you send it — offline, without any server. Nothing runs in the background. Untick it to install no model: the AI features stay off, and Settings → AI can download the model later or use another provider."
