# ══════════════════════════════════════════════════════════════════
# BetterInstaller config — Better Mods Manager (BMM)
# One TOML drives the whole installer. See ../../GUIDE.md for every field.
# ══════════════════════════════════════════════════════════════════

[app]
# MUST match the app's data-dir identifier — tauri.conf.json "identifier". BMM migrated
# com.bettermm.app -> com.bettermm.desktop; this said the old one, so the installer wrote
# installer-handoff.json into %APPDATA%\com.bettermm.app while BMM reads it from
# %APPDATA%\com.bettermm.desktop. Every setup choice was silently dropped on any install
# where BMM already had a data.json (the legacy-appdata copy only runs on a virgin one).
# app.id also keys the uninstall entry and the upgrade check, so it must not drift again.
id        = "com.bettermm.desktop"
name      = "Better Mods Manager"
version   = "1.0.3"
publisher = "BetterCommunity"
homepage  = "https://github.com/FreeProject089/BetterModsManager"
platforms = ["windows"]

[branding]
accent     = "#3b82f6"             # quick accent override (shortcut for [theme].accent)
logo       = "assets/logo.png"     # shown in the sidebar IF bundled in the payload
background = "assets/installer-bg.png"

# ─── Theme (optional) ────────────────────────────────────────────────
# Re-skin the whole installer from one place. Any field left out keeps the
# default (dark navy + BMM blue). Uncomment + edit to customise.
# [theme]
# bg           = "#0d1117"   # window background
# panel        = "#161b22"   # cards / inputs
# panel2       = "#1c2333"   # raised surfaces
# border       = "#2f3b52"
# accent       = "#3b82f6"   # primary buttons, highlights
# accent_dark  = "#1e3a8a"
# accent_hover = "#4b8ef8"
# text         = "#e6edf3"
# dim          = "#8b95a7"   # secondary text
# danger       = "#e3342f"
# shadow       = "#04060b"

# ─── Languages ───────────────────────────────────────────────────────
# The installer opens in the OS language and offers a picker. English text lives in this
# file (label / description); every other language, and the choice labels this file has
# no field for, come from installer-locales/<code>.toml, which build-installer.ps1 copies
# into the SIGNED package. Adding a language = adding a file there.
[i18n]
default     = "auto"
locales_dir = "installer-locales"

[install]
default_dir      = "{ProgramFiles}/Better Mods Manager"
main_exe         = "better-mods-manager.exe"   # shortcuts + bmm:// protocol
protocol         = "bmm"                        # registers bmm:// deep links
create_shortcuts = true
desktop_shortcut = true
# "Start with Windows" on the Location step, unticked: BMM has no tray mode, so starting it at
# every sign-in opens a window nobody asked for unless the person wants exactly that.
autostart        = false
allow_portable   = true

# ─── Package signature (trust) ───────────────────────────────────────
# The installer refuses to install a package that isn't signed by this key.
# Generate with:  bpkg keygen --out examples/bmm/keys
# Then sign the package with examples/bmm/keys/private.key (build script does it).
[security]
public_key        = "8e0647c277dd67158d34dd1c10d0a2d97191716dc4f92aebde6d349d1c0f168b"
require_signature = true

# ─── Auto-update ─────────────────────────────────────────────────────
# In maintenance mode the installer checks the manifest(s); if a newer version is
# advertised, the "Update" button downloads + applies it (delta when offered, with
# rollback on failure).
[update]
# Primary source — GitHub Releases (stable "latest" URL, never changes).
manifest_url  = "https://github.com/FreeProject089/BetterModsManager/releases/latest/download/update.json"

# OPTIONAL extra sources (mirrors / your own server). The updater fetches ALL sources
# and uses the NEWEST version found; unreachable ones are skipped. Leave empty for a
# single GitHub source — fill it in later during a patch, e.g.:
#   manifest_urls = ["https://bettercommunity.ch/api/assets/update.json"]
# Mirrors for the MANIFEST, tried after manifest_url; the newest version across all reachable
# sources wins and a dead one never blocks the others. These are BCWEB platform-asset slots —
# upload Release/update.json to the "bmm-update-json" slot in Admin -> Downloads & assets.
manifest_urls = ["https://bettercommunity.ch/api/assets/bmm-update-json"]

# Mirrors for the PACKAGE itself, written into update.json as its `urls` array. Upload
# Release/bmm.bpkg to the "bmm-bpkg" slot. Listed rather than derived: BCWEB serves assets by
# key, so the package URL is not the manifest URL with the filename swapped.
#
# Until both slots are filled these simply fail and GitHub answers as before — one wasted
# request in the case where GitHub is already down, which costs nothing that is not already lost.
package_urls = ["https://bettercommunity.ch/api/assets/bmm-bpkg"]

auto_check    = true
allow_delta   = true

# ─── Optional components ─────────────────────────────────────────────
[[components]]
id          = "core"
name        = "Better Mods Manager"
description = "Main application — required."
required    = true
default     = true
size_mb     = 43

[[components]]
id          = "mcp-server"
name        = "MCP AI Server (sidecar)"
description = "AI control server (Claude/ChatGPT via the MCP protocol)."
required    = false
default     = true
size_mb     = 7
paths       = ["bmm-mcp-server.exe", "mcp/"]

[[components]]
id          = "cli"
name        = "CLI tools"
description = "Command-line automation (bmm-cli.exe)."
required    = false
# On by default. It is 2 MB, it is what the docs and the MCP server both assume is
# present, and a user who unticks it has to reinstall to get it back.
default     = true
size_mb     = 2
# Without `paths` unticking a component removes nothing — the box would look like a
# choice and be one only in appearance.
paths       = ["bmm-cli.exe"]

# ─── First-run handoff (the headline feature) ────────────────────────
# Writes installer-handoff.json into BMM's app data; BMM reads it ONCE on first
# launch → no privacy/ToS/language/tutorial modals.
[handoff]
enabled  = true
file     = "installer-handoff.json"
location = "app_data"

# ─── Setup steps, in display order ───────────────────────────────────
# Each group is ONE step of the installer. A "Custom" install shows every step; a
# "Recommended" install shows only the steps marked `always_ask` (and any step holding a
# required choice) and takes the defaults for the rest, which the Welcome page lists.
[[setup_group]]
id          = "look"
label       = "Language & appearance"
description = "How BMM looks the first time it opens. Both can be changed at any time in Settings."

[[setup_group]]
id          = "laya"
label       = "Laya, the offline assistant"
description = "Laya suggests tags, recognises a text's language and checks a bug report before you send it. It runs on this PC."

# The cookie-banner step: always asked, even in a Recommended install, because only the
# person installing can decide what leaves their PC.
[[setup_group]]
id          = "privacy"
label       = "Privacy & data"
description = "What BMM may send off this PC. Your answer here is final: BMM does not ask again, and every item can be changed later in Settings → Privacy. The Privacy Policy lists every connection BMM makes, to whom, and how long data is kept."
always_ask  = true

[[setup_group]]
id          = "guidance"
label       = "Help & guidance"
description = "The tutorial, the Tasky mascot and in-app tips."

[[setup_group]]
id          = "behaviour"
label       = "Behaviour & starter content"
description = "How BMM works with your files, and what it adds the first time it opens."

[[setup_group]]
id          = "security"
label       = "Security"
description = "Limits BMM places on itself. Both can be changed later in Settings → Security."

[[setup_option]]
id          = "language"
type        = "select"
label_key   = "setup.language"
label       = "Language"
description  = "Interface language for Better Mods Manager."
choices     = ["auto", "en", "fr"]
default     = "auto"                 # "auto" follows the installer's language (itself the OS one unless changed)
maps_to     = "settings.language"
group       = "look"

[[setup_option.cards]]
value       = "auto"
recommended = true

[[setup_option.cards]]
value       = "en"

[[setup_option.cards]]
value       = "fr"

[[setup_option]]
id          = "theme"
type        = "swatch"
label_key   = "setup.theme"
label       = "Theme"
description  = "Starting look. Every one of these ships with BMM. The installer pre-selects Daylight when Windows is in light mode."
# Ids, not display names: they are written straight into settings.active_theme, and the
# app resolves them against builtin-themes/. A display name would drift the moment a
# preset is renamed.
choices     = ["bmm-default", "bmm-sombre", "bmm-void", "bmm-white", "bmm-discord", "bmm-orange", "bmm-spotify", "bmm-brutal", "bmm-claude", "bmm-nord", "bmm-sakura", "bmm-vscode", "bmm-macos"]
default     = "bmm-default"
# Windows in light mode (Settings → Personalisation → Colours): start on the light theme.
default_light = "bmm-white"
maps_to     = "settings.active_theme"
group       = "look"
# Asked once, on its own step with large previews. It used to be offered a second time over
# the Done page (`show_at_end`), which read as the installer forgetting the first answer.
show_at_end = false

# Four colours per theme, in order: background · surface · accent · text, read from each
# preset's own tokens (--bmm-bg-base, --bmm-bg-elevated, --bmm-accent, --bmm-text-primary).
# Generated from the theme files rather than retyped: two of these had drifted (a text
# colour written as #ffffff where the theme says #f2f3f5, and another #eceff4), which a
# tile shows as a slightly wrong preview and nothing else ever catches.
previews = [
  { value = "bmm-default", label = "Default",     colors = ["#0a0e17", "#111827", "#3b82f6", "#f1f5f9"] },
  { value = "bmm-sombre", label = "Graphite",    colors = ["#1a1a1e", "#232328", "#5865f2", "#dbdee1"] },
  { value = "bmm-void",   label = "Pure Black",  colors = ["#000000", "#0b0b0d", "#d4d4d8", "#f5f5f7"] },
  { value = "bmm-white",  label = "Daylight",    colors = ["#f5f6f8", "#ffffff", "#1d4ed8", "#18181b"] },
  { value = "bmm-discord", label = "Indigo",      colors = ["#313338", "#2b2d31", "#5865f2", "#f2f3f5"] },
  { value = "bmm-orange", label = "Ember",       colors = ["#0a0a0a", "#161614", "#ff6a00", "#f6f1ea"] },
  { value = "bmm-spotify", label = "Neon",        colors = ["#121212", "#181818", "#1ed760", "#ffffff"] },
  { value = "bmm-brutal", label = "Newsprint",   colors = ["#e7e3d8", "#fcfbf6", "#e8590c", "#111111"] },
  { value = "bmm-claude", label = "Clay",        colors = ["#f0eee6", "#fbfaf5", "#c8613f", "#2b2a27"] },
  { value = "bmm-nord",   label = "Arctic",      colors = ["#2e3440", "#3b4252", "#81a1c1", "#eceff4"] },
  { value = "bmm-sakura", label = "Blossom",     colors = ["#faf4f2", "#ffffff", "#db507c", "#3b2230"] },
  { value = "bmm-vscode", label = "Editor",      colors = ["#1f1f1f", "#252526", "#0078d4", "#cccccc"] },
  { value = "bmm-macos",  label = "Cobalt",      colors = ["#1e1e1e", "#2a2a2c", "#0a84ff", "#f5f5f7"] },
]

[[setup_option]]
id          = "legal"
type        = "license"
label_key   = "setup.acceptLegal"
label       = "Terms of Service & Privacy"
description  = "I accept the Terms of Service and the Privacy Policy. Required to continue."
documents   = ["TOS.md", "PRIVACY.md"]
# Per-language versions, same order as `documents`. A language with no entry here gets
# English, and the Terms page says so.
localized_documents = [
  { lang = "fr", documents = ["TOS_FR.md", "PRIVACY_FR.md"] },
]
required    = true
# BMM turns this on: the accept box stays disabled until the reader reaches the end of the
# document. A nudge, not proof of reading — but it is the difference between clicking past
# a wall of text and at least seeing how long it is.
require_scroll = true
maps_to     = ["settings.tos_accepted", "settings.privacy_accepted"]

# « Laya hors ligne »: the Laya classifier run INSIDE BMM (src-tauri/src/commands/ai_embedded.rs).
# ON by default, and not a `sends_data` option: inference is local, no server, no request — the
# only network use is downloading the pinned model pack during setup (from GitHub). Picked = the
# pack below is installed (`installs`) AND BMM's master switch is on with the embedded engine as
# the provider (installer_handoff.rs → ai_core::apply_installer_choice); every feature still waits
# for a click. "Not now" = no model and the AI features off. The key stays `ai_features` so the
# handoff keeps its meaning for BMM. Scripted: `--set=ai_features=false`.
[[setup_option]]
id          = "ai_features"
type        = "bool"
label_key   = "setup.aiFeatures"
label       = "Laya offline (local AI, nothing sent)"
description  = "Laya runs on this PC: when you use it, nothing leaves the PC and no server is involved. Nothing runs in the background."
default     = true
maps_to     = "settings.ai_features"
group       = "laya"
sends_data  = false
installs    = "laya-offline"

[[setup_option.cards]]
value       = "true"
label       = "Install Laya offline"
description = "A 327 MB download from the project's GitHub releases during setup (404 MB on disk), checked against its pinned SHA-256 before it is unpacked. GitHub sees your IP address, as for any download."
recommended = true

[[setup_option.cards]]
value       = "false"
label       = "Not now"
description = "No model is installed and the AI features stay off. Settings → AI can download it later, or use another provider."

# ─── Privacy: one choice, the way a cookie banner asks it ──────────────────────────────
# Three cards. « Essential only » and « Accept all » decide every option they list; the
# options themselves (below) appear only under « Customize », starting from the card that was
# picked before. No default: nothing is pre-selected, and Install stays disabled until one is
# picked — consent that was never actively given is not consent.
#
# The answer is written as settings.privacy_choice, and BMM treats it as the decision it is
# (src-tauri/src/commands/installer_handoff.rs): with a privacy_choice present, telemetry=true
# is consent and BMM's own consent dialog does not run; telemetry=false is a recorded refusal.
[[setup_option]]
id          = "privacy_choice"
type        = "select"
label_key   = "setup.privacyChoice"
label       = "What may BMM send?"
description  = "Whatever you pick, BMM checks for updates and talks to the services you use yourself (catalogues, repositories, BetterCommunity, downloads); each of those connections is listed in the Privacy Policy."
choices     = ["essential", "all", "custom"]
default     = ""
required    = true
maps_to     = "settings.privacy_choice"
group       = "privacy"

[[setup_option.cards]]
value       = "essential"
label       = "Essential only"
description = "No statistics, no telemetry, no session replay, no Discord status. BMM only makes the connections it needs to work: update checks and what you ask it to fetch."
sets        = [
  { option = "telemetry", value = false },
  { option = "discord_rpc", value = false },
  { option = "auto_update", value = true },
]

[[setup_option.cards]]
value       = "all"
label       = "Accept all"
description = "Usage statistics, performance, live error reports, Laya statistics, masked session replay and Discord Rich Presence. Telemetry goes to telemetry.bettercommunity.ch with your Creator ID and IP address, and is kept 180 days. Not included: the weekly hardware report (serial numbers, machine UUID, MAC addresses), which only Customize can turn on."
# The weekly hardware report is NOT part of « Accept all » (owner decision, Oct 2026): precise
# hardware identifiers are asked for on their own, under « Customize », exactly as BMM's own
# « Turn all on » leaves them off. Written `false` explicitly so the card decides it whatever
# was answered before, and Customize opened from this card starts with it off.
sets        = [
  { option = "telemetry", value = true },
  { option = "telemetry_usage", value = true },
  { option = "telemetry_perf", value = true },
  { option = "telemetry_live_errors", value = true },
  { option = "telemetry_laya", value = true },
  { option = "session_recorder", value = true },
  { option = "telemetry_bench", value = false },
  { option = "discord_rpc", value = true },
  { option = "auto_update", value = true },
]

[[setup_option.cards]]
value       = "custom"
label       = "Customize"
description = "Choose each category yourself. Each one says what it sends and to whom."
custom      = true

[[setup_option]]
id          = "telemetry"
type        = "bool"
label_key   = "setup.telemetry"
label       = "Usage & diagnostic telemetry"
# Said as it is, checked against the sender (src-tauri/src/commands/analytics.rs,
# frontend/src/core/analytics.ts). "Anonymous" would not be true: every batch carries the
# Creator ID, a stable identifier derived from this PC, and the public IP address (truncated on
# the server).
description  = "Sent to telemetry.bettercommunity.ch with your Creator ID (a stable ID for this PC), a random install ID and your IP address; kept 180 days. Turning it on is your consent: BMM does not ask again. Pick the categories with « Choose »."
# OPT-IN. Off unless the privacy step turns it on ("Accept all", or Customize).
default     = false
maps_to     = "settings.telemetry"
group       = "privacy"
sends_data  = true

# ─── Telemetry categories (children of `telemetry`) ───────────────────────────────────
# Shown behind the « Choisir » link of the telemetry row, only while it is on. While telemetry
# is OFF every one of them is off and written `false` in the handoff, whatever `default` says.
# Turning telemetry on turns each on at its `default`: all ON, EXCEPT the weekly hardware
# report, which stays opt-in because it sends precise hardware identifiers.
[[setup_option]]
id          = "telemetry_usage"
type        = "bool"
label_key   = "setup.telemetryUsage"
label       = "Usage statistics"
description  = "Pages and features used, button labels clicked, links opened, session length, and a description of this PC (OS, CPU, RAM, GPU, screens, disks). Never what you type."
default     = true
maps_to     = "settings.telemetry_usage"
group       = "privacy"
parent      = "telemetry"
sends_data  = true

[[setup_option]]
id          = "telemetry_perf"
type        = "bool"
label_key   = "setup.telemetryPerf"
label       = "Performance"
description  = "FPS, memory use and load times."
default     = true
maps_to     = "settings.telemetry_perf"
group       = "privacy"
parent      = "telemetry"
sends_data  = true

# Live error reports (BMM src-tauri/src/commands/live_issues.rs → AppSettings.live_errors).
[[setup_option]]
id          = "telemetry_live_errors"
type        = "bool"
label_key   = "setup.telemetryLiveErrors"
label       = "Errors & crashes, live"
description  = "Error message, where it happened, BMM version and OS, sent within seconds, plus warning and error lines of the session log. Secrets and personal paths are removed first."
default     = true
maps_to     = "settings.telemetry_live_errors"
group       = "privacy"
parent      = "telemetry"
sends_data  = true

[[setup_option]]
id          = "telemetry_laya"
type        = "bool"
label_key   = "setup.telemetryLaya"
label       = "Laya usage statistics"
description  = "Which Laya feature, provider and speed, suggestions accepted or rejected per field. Never text, queries or file names."
default     = true
maps_to     = "settings.telemetry_laya"
group       = "privacy"
parent      = "telemetry"
sends_data  = true

# What this key REALLY controls, read from BMM: the handoff consumer turns
# session_recorder=false into localStorage bmm_replay_enabled='0' (frontend/src/ui/app.ts),
# and bmm_replay_enabled is the switch for the session replay UPLOADED WITH TELEMETRY
# (frontend/src/core/analytics.ts, startSessionReplay). The local crash recorder is a
# different setting (bmm_watcher_*) that this option never touched.
[[setup_option]]
id          = "session_recorder"
type        = "bool"
label_key   = "setup.sessionRecorder"
label       = "Session replay (masked)"
description  = "A recording of the BMM window only (clicks, scrolling, navigation), with input text masked."
default     = true
maps_to     = "settings.session_recorder"
group       = "privacy"
parent      = "telemetry"
sends_data  = true

# The weekly hardware report: a child of telemetry, but OFF even when telemetry is on (not
# part of a plain "telemetry on"), and off on BMM's side too (localStorage bmm_telemetry_bench,
# absent = off). « Accept all » leaves it off too: only « Customize » turns it on.
[[setup_option]]
id          = "telemetry_bench"
type        = "bool"
label_key   = "setup.telemetryBench"
label       = "Weekly hardware report"
description  = "A weekly benchmark plus precise hardware IDs (serial numbers, machine UUID, MAC addresses). Off unless you turn it on."
default     = false
maps_to     = "settings.telemetry_bench"
group       = "privacy"
parent      = "telemetry"
sends_data  = true

[[setup_option]]
id          = "discord_rpc"
type        = "bool"
label_key   = "setup.discordRpc"
label       = "Discord Rich Presence"
# The status IS data, public to anyone who can see the profile (src-tauri/src/commands/discord.rs).
description  = "Shows on your Discord profile, to anyone who can see it: the name of your active BMM profile, how many mods are active, your Creator ID and a link that contains it. Sent through the Discord app running on this PC."
default     = false                  # matches BMM's own default (state.rs: discord_rpc_enabled = false)
maps_to     = "settings.discord_rpc"
group       = "privacy"
sends_data  = true

# Automatic update checks (BMM frontend/src/ui/update-notes.ts, localStorage
# bmm_auto_update_enabled, absent = on). Mirrored by the handoff consumer only when OFF.
[[setup_option]]
id          = "auto_update"
type        = "bool"
label_key   = "setup.autoUpdate"
label       = "Check for updates automatically"
description  = "At each start BMM asks GitHub (api.github.com), and bettercommunity.ch if GitHub does not answer, whether a newer version exists. Only your IP address and the app name are sent. Off: you check by hand in Settings."
default     = true
maps_to     = "settings.auto_update"
group       = "privacy"

# ─── Help & guidance: one choice, with the details under « Choose myself » ────────────
[[setup_option]]
id          = "guidance_level"
type        = "select"
label_key   = "setup.guidanceLevel"
label       = "How much help do you want?"
choices     = ["full", "light", "none", "custom"]
default     = "full"
group       = "guidance"

[[setup_option.cards]]
value       = "full"
label       = "Guide me"
description = "The interactive tour on first launch, Tasky the mascot with its help bubbles, and in-app tips."
recommended = true
sets        = [
  { option = "skip_tutorial", value = false },
  { option = "tasky_visible", value = true },
  { option = "tasky_tooltip", value = true },
  { option = "tasky_animated", value = true },
  { option = "tips_visible", value = true },
]

[[setup_option.cards]]
value       = "light"
label       = "Just tips"
description = "No tour and no mascot; the small explanatory tips stay."
sets        = [
  { option = "skip_tutorial", value = true },
  { option = "tasky_visible", value = false },
  { option = "tasky_tooltip", value = false },
  { option = "tasky_animated", value = false },
  { option = "tips_visible", value = true },
]

[[setup_option.cards]]
value       = "none"
label       = "I know BMM"
description = "No tour, no mascot, no tips. Warnings are always shown."
sets        = [
  { option = "skip_tutorial", value = true },
  { option = "tasky_visible", value = false },
  { option = "tasky_tooltip", value = false },
  { option = "tasky_animated", value = false },
  { option = "tips_visible", value = false },
]

[[setup_option.cards]]
value       = "custom"
label       = "Choose myself"
description = "Set each item below."
custom      = true

[[setup_option]]
id          = "skip_tutorial"
type        = "bool"
label_key   = "setup.skipTutorial"
label       = "Skip the interactive tutorial"
description  = "Don't show the guided tour the first time BMM opens."
default     = false
maps_to     = "settings.skip_tutorial"
group       = "guidance"

[[setup_option]]
id          = "tasky_visible"
type        = "bool"
label_key   = "setup.taskyVisible"
label       = "Show Tasky"
description  = "The mascot in the corner of the app. Turning it off also removes it from the sidebar."
default     = true                   # matches BMM's default
maps_to     = "settings.tasky_visible"
group       = "guidance"

[[setup_option]]
id          = "tasky_tooltip"
type        = "bool"
label_key   = "setup.taskyTooltip"
label       = "Tasky help bubbles"
description  = "The bubbles Tasky pops up to explain a screen. Independent of showing Tasky itself."
default     = true                   # matches BMM's default
maps_to     = "settings.tasky_tooltip"
group       = "guidance"

[[setup_option]]
id          = "tasky_animated"
type        = "bool"
label_key   = "setup.taskyAnimated"
label       = "Animate Tasky"
description  = "Idle movement. Off leaves the mascot still — useful with reduced-motion settings."
default     = true                   # matches BMM's default
maps_to     = "settings.tasky_animated"
group       = "guidance"

[[setup_option]]
id          = "tips_visible"
type        = "bool"
label_key   = "setup.tipsVisible"
label       = "In-app tips"
description  = "The small explanatory callouts throughout the interface. Warnings are never hidden by this."
default     = true                   # matches BMM's default
maps_to     = "settings.tips_visible"
group       = "guidance"

[[setup_option]]
id          = "smart_io"
type        = "bool"
label_key   = "setup.smartIo"
label       = "Smart I/O (recommended)"
description  = "Speeds up mod install/enable/disable by batching disk operations and picking the fastest strategy for your drive."
default     = true                   # matches BMM's default
maps_to     = "settings.smart_io"
group       = "behaviour"

[[setup_option]]
id          = "sound_effects"
type        = "bool"
label_key   = "setup.soundEffects"
label       = "Interface sound effects"
description  = "Subtle click/confirm sounds in the UI."
default     = true                   # matches BMM's default
maps_to     = "settings.sound_effects"
group       = "behaviour"

# Pre-import: bundled content the installer seeds on first launch (copied from the install
# folder, nothing downloaded).
[[setup_option]]
id          = "import_themes"
type        = "bool"
label_key   = "setup.importThemes"
label       = "Import the starter theme pack"
description  = "Adds a curated set of ready-made themes the first time BMM opens. Off keeps only the built-in themes."
default     = true
maps_to     = "settings.import_starter_themes"
group       = "behaviour"

[[setup_option]]
id          = "import_languages"
type        = "bool"
label_key   = "setup.importLanguages"
label       = "Import extra language packs"
description  = "Installs additional community translations beyond the built-in English & French (those two are always installed)."
default     = true
maps_to     = "settings.import_extra_languages"
group       = "behaviour"

# System Access Control — how much of the filesystem BMM's own operations may reach.
# Maps to BMM's fs_security_mode setting.
[[setup_option]]
id          = "system_access"
type        = "select"
label_key   = "setup.systemAccess"
label       = "System Access Control"
description  = "How much filesystem access BMM's own operations get. You can change this later in Settings."
choices     = ["full", "limited"]
default     = "full"
maps_to     = "settings.fs_security_mode"
group       = "security"

[[setup_option.cards]]
value       = "full"
description = "The normal mode: BMM manages mods wherever you point it."
recommended = true

[[setup_option.cards]]
value       = "limited"
description = "File operations stay inside the folders you configure. Safer, but some actions ask for confirmation more often."

# ─── Security: the browser policy BMM starts with ──────────────────
# A preset ID, never a policy string. An installer choice that could type a raw CSP would be
# a way to hand the app a policy nobody reviewed; a preset id is a choice among values BMM
# already ships and validates. "custom" writes nothing and leaves the field in
# Settings → Security for someone who wants to author one by hand.
#
# Whatever is chosen applies from the SECOND launch: a CSP meta tag is only honoured while
# the document is parsed, so the value written on first run is read by the loader the next
# time BMM opens.
[[setup_option]]
id          = "csp_preset"
type        = "select"
label_key   = "setup.cspPreset"
label       = "Browser security policy"
description  = "Extra restrictions on what BMM may load and run, added on top of the policy it ships with: they can only make it stricter. Applies from the second launch; changeable at any time in Settings → Security."
choices     = ["none", "network", "strict", "custom"]
default     = "none"
maps_to     = "settings.csp_preset"
group       = "security"

[[setup_option.cards]]
value       = "none"
description = "Keeps the shipped policy, which already refuses inline scripts."
recommended = true

[[setup_option.cards]]
value       = "network"
description = "Stops the app contacting hosts it does not need."

[[setup_option.cards]]
value       = "strict"
description = "Also blocks third-party scripts and embeds, which turns off embedded YouTube and Spotify players."

[[setup_option.cards]]
value       = "custom"
description = "Writes nothing now: you author your own policy later in Settings → Security."

# ─── Post-install launch (offered on the Done page) ──────────────────
# The main app is pre-checked; the optional sidecar is opt-in and only shown
# when its component was actually installed.
[[launch]]
id      = "app"
label   = "Launch Better Mods Manager"
exe     = "better-mods-manager.exe"
default = true

[[launch]]
id        = "mcp"
label     = "Start the MCP AI server now"
exe       = "bmm-mcp-server.exe"
default   = false
component = "mcp-server"

# ── Prerequisites ─────────────────────────────────────────────────────────────
#
# Python, for the scheduler's "Run a script" action. BMM bundles no interpreter, so a
# Python task on a machine without one fails at whatever hour it was scheduled for.
#
# The EMBEDDABLE build, not the full installer: ~10 MB, no elevation, nothing written
# outside the install directory, no PATH changes, and uninstalling is deleting a folder.
# The full installer would need admin rights and would modify the user's machine for the
# sake of one optional feature.
#
# install_to matches where BMM's scheduler looks (see resolve_engine / managed_engine in
# src-tauri/src/commands/scheduler.rs). Change one and you must change the other — they
# are a contract, and nothing checks it at build time.
[[prerequisite]]
id   = "python"
name = "Python 3.12 (embeddable)"

# `py`, deliberately NOT `python`.
#
# check_command is a file-existence test on PATH, and on a stock Windows `python.exe`
# EXISTS as a Microsoft Store App Execution Alias — a stub that opens the Store and runs
# nothing. Testing for `python` would therefore report "already installed" on exactly the
# machines that have no interpreter. `py` is the official launcher and is not shadowed by
# an alias, so its presence means a real Python. This is the same trap that made scheduler
# tasks fail with "Could not start python".
check_command = "py"

# Which Python. The embeddable build below is 3.12, and a task written against it can
# use syntax 3.8 does not have — so an older interpreter already on PATH must not count as
# satisfying this. Without a minimum, `py` existing was the whole test.
min_version   = "3.9"

kind         = "zip"
download_url = "https://www.python.org/ftp/python/3.12.9/python-3.12.9-embed-amd64.zip"
# Published by python.org in the release's own SPDX SBOM
# (python-3.12.9-embed-amd64.zip.spdx.json). Taken from there rather than the release
# page, which lists only MD5 — and MD5 is not a integrity guarantee worth pinning to.
sha256       = "615861fb801e8b04c847598db4e1e46e4b046295017caa37cb5486dde72b5865"
install_to   = "runtime/python"

# Optional: BMM works fully without it, and only the scheduler's script action wants it.
# NOTE: prereq::ensure_required only auto-installs entries with required = true, so as it
# stands this is declared and detected but never fetched. Offering it as a checkbox is the
# remaining piece — making it required instead would force a 10 MB download on everyone
# for a feature most people never use.
required = false

# The « Laya hors ligne » model pack: the quantized Laya multilingual model, its tokenizer and
# config, and Microsoft's ONNX Runtime DLL — everything BMM needs to classify offline. Not a row
# of its own: the `ai_features` option above installs it (`installs = "laya-offline"`).
#
# DOWNLOADED, not packed into bmm.bpkg: 327 MB of quantized weights compress badly (the pack is
# 404 MB unzipped), and in the payload they would make every BMM-Setup.exe and every full update
# package six times larger, including for everyone who unticks the box. The download streams to
# disk, is refused unless it matches the SHA-256 below, and unpacks into <install>/models/laya,
# which is where BMM looks first (then %LOCALAPPDATA%\com.bettermm.desktop\models\laya, where
# Settings → AI puts a copy for users who skipped it here).
#
# Pinned three times, and a test fails when they disagree: here, laya-model.lock.json at the BMM
# root, and src-tauri/src/commands/ai_embedded.rs (`installer_pins_match_the_lock_file`).
# The pack is built by BMM's scripts/laya/build_pack.py and published as a release asset.
[[prerequisite]]
id   = "laya-offline"
name = "Laya offline model"
check_file   = "models/laya/laya.onnx"
kind         = "zip"
download_url = "https://github.com/FreeProject089/BetterModsManager/releases/download/laya-model-1/laya-offline-1.zip"
sha256       = "e276b90f3e16de8273fa34cc202ea140b64cd08345072fcea19fc5df31de62b5"
install_to   = "models/laya"
required     = false

# Node.js, for plugin authors and anything a scheduled task shells out to.
#
# CHECKED but not downloaded: no download_url, so this reports whether the machine has a
# new enough Node and stops there. Fetching a Node build is a 30 MB decision with an
# install layout of its own, and declaring it here without one would be a promise the
# installer cannot keep — better to say "you need this" than to fail halfway through
# getting it.
#
# min_version is what makes this worth declaring at all. `node` on PATH says nothing about
# which build: a machine with Node 14 would have satisfied a bare presence check and then
# failed on syntax nobody would connect back to this.
[[prerequisite]]
id            = "node"
name          = "Node.js 20 or later"
check_command = "node"
min_version   = "20.0.0"
required      = false
